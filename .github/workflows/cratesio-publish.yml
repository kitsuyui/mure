name: publish crates

on:
  release:
    # "released" events are emitted either when directly be released or be edited from pre-released.
    types: [prereleased, released]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
      - name: Validate release tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          package_version="$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          release_version="${GITHUB_REF_NAME#v}"
          if [[ "$release_version" != "$package_version" ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match Cargo.toml version $package_version"
            exit 1
          fi
      - run: cargo build --release --all-features

      - name: publish (dry-run)
        if: github.event_name == 'release' && github.event.release.prerelease
        run: cargo publish --dry-run --allow-dirty

      - name: Authenticate to crates.io
        if: github.event_name == 'release' && !github.event.release.prerelease
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: publish
        if: github.event_name == 'release' && !github.event.release.prerelease
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
